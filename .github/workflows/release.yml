name: Release

# Publishing is a deliberate act: pushing a tag is the only trigger, and
# workflow_dispatch exists so a failed publish can be retried without inventing
# a new tag.
on:
  push:
    # Full version tags only. The moving major tag `v0`, which the Action is
    # used through, points at a commit whose manifest says 0.2.0, so it can
    # never match the version check below and has no release to cut anyway.
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance: the OIDC token is what lets npm attest that
  # this tarball was built from this commit, in this workflow.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` input on purpose: action-setup@v6 refuses when a version is
      # given here AND package.json pins `packageManager`. The manifest wins,
      # so CI runs the exact pnpm the repository declares.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The full gate runs again here. A tag is not a promise that CI was green
      # on that commit, so we prove it rather than assume it.
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

      # Refuse to publish a tag that disagrees with the manifest. Without this,
      # `git tag v0.2.0` on a 0.1.0 manifest silently republishes 0.1.0.
      - name: Check the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $manifest" >&2
            exit 1
          fi

      # A release can be re-cut, a tag can be moved, and a version can already
      # have been published by hand. Publishing twice is an error, so ask the
      # registry rather than assume.
      - name: Is this version already on npm?
        id: published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "openspec-guard@$version" version >/dev/null 2>&1; then
            echo "Already on npm: $version. Nothing to publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with provenance
        if: steps.published.outputs.exists == 'false'
        run: pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
