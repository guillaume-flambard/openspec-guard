name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. Nothing in this workflow writes to the repository.
permissions:
  contents: read

# A new push on the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` input on purpose: action-setup@v6 refuses when a version is
      # given here AND package.json pins `packageManager`. The manifest wins,
      # so CI runs the exact pnpm the repository declares.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile: CI installs what the lockfile says, or fails.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck

      # The build runs before the tests on purpose: tests/cli.test.ts drives the
      # built artifact in a subprocess, not the sources.
      - run: pnpm build
      - run: pnpm test

      # A JavaScript action runs the committed bundle, so a stale bundle ships
      # old behaviour while the source looks correct. Rebuilding and diffing is
      # the only thing that keeps the two honest.
      - name: The committed action bundle matches the source
        run: |
          git diff --exit-code --stat -- action-dist || {
            echo "action-dist is out of date. Run pnpm build and commit it." >&2
            exit 1
          }

      # openspec-guard checking its own fixture corpus. It is not a gate here: the
      # corpus deliberately contains failing cases.
      - name: Self check
        run: node dist/cli.js check --cwd tests/fixtures/corpus --include-changes

      # The Action, run as the runner would run it, against a fixture that is
      # known to fail: proof the bundle loads and that the gate turns the step
      # red for the right reason.
      - name: The action bundle runs
        run: node action-dist/index.cjs
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}/tests/fixtures/pass-explicit
